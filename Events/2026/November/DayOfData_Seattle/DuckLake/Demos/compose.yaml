name: ducklake-seattle
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ducklake_catalog
      POSTGRES_USER: ducklake_demo
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake_demo -d ducklake_catalog"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  catalog:
